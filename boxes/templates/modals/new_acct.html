{% block content %}
<div class="modal fade" id="createNewCustomerModal" tabindex="-1" aria-labelledby="createNewCustomerModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="createNewCustomerModalLabel">Create New Customer</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body container">
                <form id="userform">
                    <div class="row">
                        <div class="col-md-1">
                            <label for="prefix" class="form-label">Prefix</label>
                            <input type="text" class="form-control" id="prefix" name="prefix">
                            <div class="invalid-feedback"></div>
                        </div>
                        <div class="col-md-3">
                            <label for="first_name" class="form-label">First Name</label>
                            <input type="text" class="form-control" id="first_name" name="first_name">
                            <div class="invalid-feedback"></div>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="middle_name" class="form-label">Middle Name</label>
                            <input type="text" class="form-control" id="middle_name" name="middle_name">
                            <div class="invalid-feedback"></div>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="last_name" class="form-label">Last Name</label>
                            <input type="text" class="form-control" id="last_name" name="last_name">
                            <div class="invalid-feedback"></div>
                        </div>
                        <div class="col-md-1 mb-3">
                            <label for="suffix" class="form-label">Suffix</label>
                            <input type="text" class="form-control" id="suffix" name="suffix">
                            <div class="invalid-feedback"></div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-3 mb-3">
                            <label for="company" class="form-label">Company</label>
                            <input type="text" class="form-control" id="company" name="company">
                            <div class="invalid-feedback"></div>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="phone_number" class="form-label">Phone Number</label>
                            <input type="text" class="form-control" id="phone_number" name="phone_number">
                            <div class="invalid-feedback"></div>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <input type="email" class="form-control" id="email" name="email">
                            <div class="invalid-feedback"></div>
                        </div>
                    </div>

                    <hr>
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="checkbox" id="create_account" name="create_account" value="1" checked>
                        <label class="form-check-label" for="create_account">
                            Create billing account
                        </label>
                        <div class="form-text">Uncheck to create a login only (no parcels/billing account).</div>
                    </div>

                    <div class="mb-2">
                        <label class="form-label d-block">Portal access</label>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="portal_mode" id="portal_none" value="none" checked>
                            <label class="form-check-label" for="portal_none">
                                None (billing/check-in only; inactive placeholder login if account is created)
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="portal_mode" id="portal_credentials" value="credentials">
                            <label class="form-check-label" for="portal_credentials">
                                Create login credentials now
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="portal_mode" id="portal_invite" value="invite">
                            <label class="form-check-label" for="portal_invite">
                                Send sign-up invitation email (customer registers via link only)
                            </label>
                        </div>
                    </div>

                    <div class="row" id="web-account-fields" style="display: none;">
                        <div class="col-md-4 mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="username" name="username" autocomplete="off">
                            <div class="invalid-feedback"></div>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" name="password" autocomplete="new-password">
                            <div class="invalid-feedback"></div>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="password2" class="form-label">Confirm Password</label>
                            <input type="password" class="form-control" id="password2" name="password2" autocomplete="new-password">
                            <div class="invalid-feedback"></div>
                        </div>
                    </div>

                    <div id="invite-hint" class="alert alert-info py-2 small" style="display: none;">
                        An email with a one-time registration link will be sent. Open registration is not available —
                        only this invite link can create the login.
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <i id="savingiconnew" class="fas fa-spinner fa-spin text-warning" style="display: none;"></i>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Discard</button>
                <button type="button" class="btn btn-primary" id="createCustomerBtn">Create</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
