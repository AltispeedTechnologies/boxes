<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="shortcut icon" type="image/x-icon" href="/media/images/favicon.ico">

        {% load static %}

        <!-- Bootstrap 5.3.8 (single pin for the whole app) -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha512-2bBQCjcnw658Lho4nlXJcc6WkV/UxpE/sAokbXPxQNGqmNdQrWqtw26Ns9kFF/yG792pKR1Sx8/Y1Lf1XN4GKA==" crossorigin="anonymous">

        <!-- Select2 -->
        <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />

        <!-- Font Awesome -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

        <!-- App styles (after vendor CSS) -->
        <link rel="stylesheet" href="{% static 'css/boxes.css' %}" />

        <!-- jQuery 3.7.1 (plugin-safe; jQuery UI / Select2) -->
        <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

        <!-- Bootstrap bundle (Popper included) -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha512-HvOjJrdwNpDbkGJIG2ZNqDlVqMo77qbs4Me4cah0HoDrfhrbA+8SBlZn1KrvAQw7cILLPFJvdwIgphzQmMm+Pw==" crossorigin="anonymous"></script>

        <!-- Select2 -->
        <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

        <!-- htmx 2.x app shell (boost inside #app-main only) -->
        <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>

        <!-- Application-wide JS (BoxesPage, CSRF, Select2 helpers, htmx hooks) -->
        <script src="{% static 'js/app.js' %}"></script>
        <script src="{% static 'js/setup_status.js' %}"></script>

        <!-- Page-specific JS (full document navigation only; prefer BoxesPage.register) -->
        {% block javascript %}{% endblock javascript %}

        <title>{% block title %}Boxes{% endblock title %}</title>
    </head>
    <body class="bg-light bg-gradient">
        {# Navbar stays mounted across htmx-boosted navigations; data-auth detects login/logout drift #}
        {% include "_navbar.html" %}

        <main id="app-main"
              class="{% block main_class %}{% endblock main_class %}"
              data-auth="{% if request.user.is_authenticated %}1{% else %}0{% endif %}"
              hx-boost="true"
              hx-target="#app-main"
              hx-select="#app-main"
              hx-swap="outerHTML"
              hx-push-url="true"
              {% block page_attrs %}{% endblock page_attrs %}>
            <div class="{% block main_container_class %}container mt-4{% endblock main_container_class %}">
                {% block content %}{% endblock content %}
            </div>
        </main>
    </body>
</html>
