{% extends "base.html" %}

{% block javascript %}
{% load static %}
<script src="{% static 'js/check_out.js' %}"></script>
<script src="{% static 'js/check_out_box.js' %}"></script>
{% endblock %}

{% block content %}
<div class="bg-body shadow rounded p-3" id="checkoutpage">
    <div class="container mb-4">
        <div class="row bg-primary bg-gradient rounded mb-3">
            <h2 class="text-center text-white py-2">Check Out</h2>
        </div>
    </div>

    {% include "_messages.html" %}
    {% include "check_out/searchbox.html" %}

    <div class="container d-flex justify-content-end gap-2 mb-3">
        <button type="button" id="clearstagedbtn" class="btn btn-outline-danger"
                title="Clear staged packages without checking them out">
            Clear Staged
        </button>
        <button type="button" class="btn btn-primary"
                data-bs-target="#checkOutModal" data-bs-toggle="modal">
            Check Out All Packages
        </button>
    </div>


    {% include "check_out/table.html" %}
</div>

<script>
    window.queued_packages = new Set({{ package_ids|safe }});
</script>
{% endblock %}
